<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rapidex</title>
<style>
:root {
  --bg:      #0c0c0f;
  --surface: #131318;
  --card:    #1a1a21;
  --border:  rgba(255,255,255,.07);
  --bordhi:  rgba(255,255,255,.14);
  --fg:      #dddde6;
  --muted:   #8c8ca8;
  --accent:  #5b8cf7;
  --danger:  #e96b6b;
  --r:       10px;
  color-scheme: dark;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; }
html { width: 580px; }
body {
  width: 580px; min-height: 400px; max-height: 580px;
  background: var(--bg); color: var(--fg);
  font: 14px/1.5 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
/* quando aberta como aba completa */
@media (min-width: 700px) {
  html { width: auto; }
  body { width: 100%; max-height: 100vh; }
  main { padding: 16px 24px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
}
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 11px 14px; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; flex-shrink: 0;
}
.logo { font-size: 15px; font-weight: 600; letter-spacing: -.2px; display: flex; align-items: baseline; gap: 5px; }
.logo em { font-style: normal; color: var(--accent); }
.logo #version { font: 10px Consolas, monospace; color: var(--muted); font-weight: 400; }
#count { font: 11px Consolas, monospace; color: var(--muted); margin-top: 2px; }
#emptyHint { font: 12px 'Segoe UI', sans-serif; color: var(--muted); margin-top: 3px; }
#status {
  font: 11px Consolas, monospace; color: var(--muted);
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
}
#dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
#dot.on { background: #4ade80; box-shadow: 0 0 6px #4ade8077; }
.hdr-btns { display: flex; align-items: center; gap: 7px; }
select {
  font: 500 11px Consolas, monospace; background: var(--card); color: var(--muted);
  border: 1px solid var(--border); border-radius: 5px; padding: 4px 7px; cursor: pointer; appearance: none;
}
.btn {
  font: 500 12px 'Segoe UI', sans-serif; padding: 5px 12px; border-radius: 5px;
  cursor: pointer; white-space: nowrap; transition: background .12s, opacity .12s;
}
.btn-zip {
  color: var(--accent); background: transparent; border: 1px solid rgba(91,140,247,.3);
}
.btn-zip:hover:not(:disabled) { background: rgba(91,140,247,.1); }
.btn-zip:disabled { opacity: .25; cursor: default; }
.btn-clear {
  color: var(--danger); background: transparent; border: 1px solid rgba(233,107,107,.3);
}
.btn-clear:hover:not(:disabled) { background: rgba(233,107,107,.12); }
.btn-clear:disabled { opacity: .25; cursor: default; }
.btn-clear.armed { background: var(--danger); color: #fff; border-color: transparent; }
.btn-capture {
  color: #fff; background: #3a65d6; border: none;
}
.btn-capture:hover:not(:disabled) { filter: brightness(1.15); }
.btn-capture:disabled { opacity: .4; cursor: default; }
main { flex: 1; overflow-y: auto; padding: 12px 14px; }
kbd {
  display: inline-block; background: var(--card); border: 1px solid var(--bordhi);
  border-radius: 3px; padding: 1px 5px; font: 11px Consolas, monospace; color: var(--fg);
}
.grid { display: grid; grid-template-columns: repeat(var(--cols,3), 1fr); gap: 9px; }
.col-ctrl { display: flex; align-items: center; gap: 5px; font: 11px Consolas, monospace; color: var(--muted); flex-shrink: 0; }
.col-ctrl input[type=range] { width: 56px; accent-color: var(--accent); cursor: pointer; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  overflow: hidden; cursor: zoom-in; transition: transform .13s, border-color .13s;
  position: relative; outline: none;
}
.card:hover { transform: translateY(-2px); border-color: var(--bordhi); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: top left; background: #0a0a0d; display: block; }
.card-bar {
  padding: 6px 8px; display: flex; align-items: center; justify-content: space-between;
  font: 10px Consolas, monospace; color: var(--muted);
}
.card-del {
  position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border-radius: 50%;
  border: none; background: rgba(0,0,0,.65); color: rgba(255,255,255,.8); font-size: 13px;
  line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .13s, background .13s;
}
.card:hover .card-del { opacity: 1; }
.card-del:hover { background: var(--danger); color: #fff; }
.card-check {
  position: absolute; top: 6px; left: 6px; width: 16px; height: 16px;
  opacity: 0; transition: opacity .13s; cursor: pointer; accent-color: var(--accent);
  z-index: 2;
}
.card:hover .card-check,
.card.selected .card-check { opacity: 1; }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn-sel-dl  { color: var(--accent); background: transparent; border: 1px solid rgba(91,140,247,.3); }
.btn-sel-dl:hover  { background: rgba(91,140,247,.1); }
.btn-sel-del { color: var(--danger); background: transparent; border: 1px solid rgba(233,107,107,.3); }
.btn-sel-del:hover { background: rgba(233,107,107,.12); }
#lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,.9);
  backdrop-filter: blur(5px); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
#lightbox[hidden] { display: none !important; }
#lightboxImg {
  max-width: 90%; max-height: calc(100vh - 80px); border-radius: 5px; display: block;
  transform-origin: center; cursor: zoom-in; user-select: none; -webkit-user-drag: none;
}
#lightboxImg.zoomed { cursor: grab; }
#lightboxImg.panning { cursor: grabbing !important; }
.lb-nav {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 38px; height: 38px; border-radius: 50%; border: none;
  background: rgba(255,255,255,.13); color: #fff; font-size: 20px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .12s;
}
.lb-nav:hover:not(:disabled) { background: rgba(255,255,255,.26); }
.lb-nav:disabled { opacity: .18; cursor: default; }
#lightboxPrev { left: 10px; }
#lightboxNext { right: 10px; }
#lightboxClose {
  position: fixed; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%;
  border: none; background: rgba(255,255,255,.12); color: #fff; font-size: 14px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
#lightboxHint {
  position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
  font: 12px Consolas, monospace; color: rgba(255,255,255,.3); pointer-events: none; white-space: nowrap;
}
#lightboxSave {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  font: 500 12px 'Segoe UI', sans-serif; color: #fff;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
  padding: 6px 16px; border-radius: 18px; cursor: pointer; white-space: nowrap;
}
#lightboxSave:hover { background: rgba(255,255,255,.22); }
#toast {
  position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%) translateY(4px);
  background: var(--card); border: 1px solid var(--bordhi); color: var(--fg);
  font-size: 11px; padding: 6px 14px; border-radius: 18px;
  z-index: 200; pointer-events: none; opacity: 0;
  transition: opacity .18s, transform .18s; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">Rapid<em>ex</em><span id="version"></span></div>
    <div id="count">0 capturas</div>
    <div id="emptyHint">Tire um print — salva automaticamente</div>
  </div>
  <div class="hdr-btns">
    <button class="btn btn-capture" id="btnCapture" title="Capturar da área de transferência">Capturar</button>
    <button id="btnTab" title="Abrir em aba" style="background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center;" aria-label="Abrir em aba">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <div id="status"><div id="dot"></div><span id="statusTxt">aguardando</span></div>
    <select id="sortSel">
      <option value="newest">↓ Recente</option>
      <option value="oldest">↑ Antiga</option>
    </select>
    <div class="col-ctrl" title="Colunas por linha">
      <span id="colsVal">3</span>
      <input type="range" id="colsSlider" min="2" max="6" value="3">
    </div>
    <button class="btn btn-sel-dl"  id="btnSelDl"  hidden>Baixar (0)</button>
    <button class="btn btn-sel-del" id="btnSelDel" hidden>Excluir (0)</button>
    <button class="btn btn-zip" id="btnZip" disabled>Baixar tudo</button>
    <button class="btn btn-clear" id="btnClear" disabled>Limpar</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div id="lightbox" hidden>
  <button id="lightboxClose">&#x2715;</button>
  <button class="lb-nav" id="lightboxPrev">&#8592;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lb-nav" id="lightboxNext">&#8594;</button>
  <button id="lightboxSave">Salvar JPG</button>
  <div id="lightboxHint">scroll = zoom &nbsp;·&nbsp; arrastar = mover &nbsp;·&nbsp; ← → = navegar</div>
</div>
<div id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
